
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#121212">
  <title>Kubo 3D - N64</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px;
      background: #121212;
      color: #fff;
      font-family: system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      color: #00ffcc;
      font-size: 26px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #999;
      margin: 0;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 14px;
      min-width: 0;
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #252525;
    }

    .card h2 {
      font-size: 15px;
      margin: 12px 5px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 8px;
      background: #00a878;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      touch-action: manipulation;
    }

    .btn:active {
      background: #008e65;
      transform: scale(.97);
    }

    @media (min-width: 600px) {
      body {
        padding: 30px;
      }

      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .card h2 {
        font-size: 17px;
      }
    }

    @media (max-width: 340px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Kubo 3D - N64</h1>
    <p class="subtitle">Biblioteca de Cartuchos NFC</p>
  </header>

  <main class="grid">
    <article class="card">
      <img
        src="https://raw.githubusercontent.com/grupoplanejar2024-coder/kubo3D-N64/main/imagens/goldeneye-cover.jpg"
        alt="Capa de GoldenEye 007"
        width="300"
        height="400"
        fetchpriority="high"
        decoding="async">

      <h2>GoldenEye 007</h2>

      <a class="btn" href="jogos/goldeneye.html">
        ▶ JOGAR
      </a>
    </article>
  </main>
</body>
</html>
