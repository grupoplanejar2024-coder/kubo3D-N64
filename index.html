
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#000000">
  <title>GoldenEye 007 - Kubo Touch</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overscroll-behavior: none;
    }

    #intro {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    #intro img {
      display: block;
      width: 100%;
      max-height: 35vh;
      object-fit: contain;
      margin-bottom: 16px;
    }

    h1 {
      color: #ffca28;
      font-size: 24px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #159957;
      width: 100%;
      min-height: 48px;
      touch-action: manipulation;
    }

    #game-container {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #game canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    body.playing {
      overflow: hidden;
    }
  </style>
</head>

<body>
  <main id="intro">
    <img
      src="https://raw.githubusercontent.com/grupoplanejar2024-coder/kubo3D-N64/main/imagens/goldeneye-cover.jpg"
      alt="GoldenEye 007"
      width="300"
      height="400"
      fetchpriority="high">

    <h1>GoldenEye 007</h1>
    <p>Jogue GoldenEye 007 no seu celular com o controle virtual N64.</p>
    <button id="play">▶ JOGAR AGORA</button>
  </main>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    const playButton = document.getElementById("play");

    playButton.addEventListener("click", startEmulator, {
      once: true
    });

    function startEmulator() {
      document.getElementById("intro").style.display = "none";
      document.getElementById("game-container").style.display = "block";
      document.body.classList.add("playing");

      // EmulatorJS configuration
      window.EJS_player = "#game";
      window.EJS_core = "n64";
      window.EJS_gameName = "GoldenEye 007";
      window.EJS_color = "#ff9800";

      window.EJS_startOnLoaded = true;
      window.EJS_fullscreenOnLoaded = false;
      window.EJS_browserMode = "mobile";
      window.EJS_controlScheme = "n64";

      window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

      window.EJS_gameUrl =
        "https://cdn.jsdelivr.net/gh/grupoplanejar2024-coder/kubo3D-N64@main/roms/goldeneye-007.z64";

      const script = document.createElement("script");
      script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";
      script.async = true;

      script.onerror = () => {
        alert("Não foi possível carregar o emulador. Verifique sua conexão.");
      };

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
