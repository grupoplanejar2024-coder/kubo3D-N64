<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubo3D - N64</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00ffcc; margin-bottom: 5px; }
        p.subtitle { color: #888; margin-top: 0; margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            text-align: center;
            padding-bottom: 15px;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card h3 { margin: 10px 0 5px; font-size: 18px; }
        .btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
        .btn:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>kubo3D - N64</h1>
    <p class="subtitle">Biblioteca de Cartuchos NFC</p>

    <div class="grid">
        <!-- Card do GoldenEye 007 -->
        <div class="card">
            <img src=<img src="https://raw.githubusercontent.com/grupoplanejar2024-coder/kubo3D-N64/main/imagens/goldeneye-cover.jpg" alt="Capa GoldenEye 007" class="game-cover">
            <h3>GoldenEye 007</h3>
            <a href="jogos/goldeneye.html" class="btn">▶ JOGAR</a>
        </div>
        
        <!-- Adicione novos jogos aqui no futuro -->
    </div>

</body>
</html>
