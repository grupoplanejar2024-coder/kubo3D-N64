<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>GoldenEye 007 - Kubo Touch</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #intro {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #intro img {
      display: block;
      width: 100%;
      max-height: 35vh;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    h1 {
      color: #ffca28;
      font-size: 26px;
      margin: 0 0 8px 0;
    }

    p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 24px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #159957;
      width: 100%;
      min-height: 52px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 12px rgba(21, 153, 87, 0.4);
    }

    button:active {
      transform: scale(0.98);
      background: #117d47;
    }

    #game-container {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #game canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>

<body>
  <main id="intro">
    <img
      src="https://raw.githubusercontent.com/grupoplanejar2024-coder/kubo3D-N64/main/imagens/goldeneye-cover.jpg"
      alt="GoldenEye 007"
      width="300"
      height="400"
      fetchpriority="high">

    <h1>GoldenEye 007</h1>
    <p>Jogue GoldenEye 007 no seu celular com controle otimizado.</p>
    <button id="play">▶ JOGAR AGORA</button>
  </main>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    const playButton = document.getElementById("play");

    const handleStart = (e) => {
      e.preventDefault();
      startEmulator();
    };

    playButton.addEventListener("touchstart", handleStart, { once: true, passive: false });
    playButton.addEventListener("click", handleStart, { once: true });

    function startEmulator() {
      document.getElementById("intro").style.display = "none";
      document.getElementById("game-container").style.display = "block";

      // Configurações avançadas de otimização para EmulatorJS
      window.EJS_player = "#game";
      window.EJS_core = "n64";
      window.EJS_gameName = "GoldenEye 007";
      window.EJS_color = "#ff9800";

      // Desativa filtro de imagem suave para economizar GPU e dar mais FPS
      window.EJS_smooth = false;
      
      // Otimização de CPU/Threads em navegadores móveis
      window.EJS_threads = false;

      // Execução e controle mobile
      window.EJS_startOnLoaded = true;
      window.EJS_fullscreenOnLoaded = false;
      window.EJS_browserMode = "mobile";
      window.EJS_controlScheme = "n64";
      window.EJS_virtualGamepad = true;

      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/grupoplanejar2024-coder/kubo3D-N64@main/roms/goldeneye-007.z64";

      const script = document.createElement("script");
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      script.async = true;

      script.onerror = () => {
        alert("Não foi possível carregar o emulador. Verifique sua conexão.");
      };

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
