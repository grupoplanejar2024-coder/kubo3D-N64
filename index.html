<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>GoldenEye 007 - Controles Otimizados</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #intro {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #intro img {
      width: 100%;
      max-height: 35vh;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    h1 {
      color: #ffca28;
      font-size: 24px;
      margin: 0 0 8px 0;
    }

    p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 24px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #159957;
      width: 100%;
      min-height: 52px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #game-container {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    /* Otimizações nos botões virtuais do emulador */
    .ejs_gamepad {
      opacity: 0.75 !important; /* Aumenta a visibilidade */
    }
  </style>
</head>

<body>
  <main id="intro">
    <img
      src="https://raw.githubusercontent.com/grupoplanejar2024-coder/kubo3D-N64/main/imagens/goldeneye-cover.jpg"
      alt="GoldenEye 007">

    <h1>GoldenEye 007</h1>
    <p>Controles de N64 reajustados para melhor precisão em telas touch.</p>
    <button id="play">▶ JOGAR AGORA</button>
  </main>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    const playButton = document.getElementById("play");

    const handleStart = (e) => {
      e.preventDefault();
      startEmulator();
    };

    playButton.addEventListener("touchstart", handleStart, { once: true, passive: false });
    playButton.addEventListener("click", handleStart, { once: true });

    function startEmulator() {
      document.getElementById("intro").style.display = "none";
      document.getElementById("game-container").style.display = "block";

      window.EJS_player = "#game";
      window.EJS_core = "n64";
      window.EJS_gameName = "GoldenEye 007";
      window.EJS_color = "#ff9800";

      // Performance e renderização
      window.EJS_smooth = false;
      window.EJS_threads = false;

      // Layout touch responsivo
      window.EJS_startOnLoaded = true;
      window.EJS_fullscreenOnLoaded = false;
      window.EJS_browserMode = "mobile";
      window.EJS_controlScheme = "n64";
      window.EJS_virtualGamepad = true;

      // Mapeamento otimizado de botões virtuais
      window.EJS_settings = {
        virtualGamepadTransparency: 0.7,
        analogueSensibility: 1.2 // Melhora a resposta da mira no toque
      };

      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/grupoplanejar2024-coder/kubo3D-N64@main/roms/goldeneye-007.z64";

      const script = document.createElement("script");
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      script.async = true;

      script.onerror = () => {
        alert("Erro ao carregar o emulador.");
      };

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
