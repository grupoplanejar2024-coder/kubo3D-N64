<script>
        function startEmulator() {
            document.getElementById('game-card').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            // Configurações do EmulatorJS para Nintendo 64
            window.EJS_player = "#game";
            window.EJS_core = "mupen64plus";
            window.EJS_gameName = "GoldenEye 007";
            window.EJS_color = "#ff9800";
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

            // Força o uso da versão compatível do core para evitar falha de download
            window.EJS_bios = "";
            
            // Link direto da ROM do GoldenEye no seu repositório N64
            window.EJS_gameUrl = "https://raw.githubusercontent.com/grupoplanejar2024-coder/kubo3D-N64/main/roms/goldeneye.z64";
            
            let script = document.createElement("script");
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(script);
        }
    </script>
